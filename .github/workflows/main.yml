name: Update Analytics Data

on:
  schedule:
    - cron: '0 * * * *' # Executa a cada hora
  workflow_dispatch: # Permite execução manual para testes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-analytics-data

      - name: Run update script
        env:
          GA_JSON: ${{ secrets.GA_KEY_JSON }}
        run: |
          # Cria o arquivo de credenciais preservando o formato JSON
          printf "%s" "$GA_JSON" > credentials.json
          python update_stats.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add analytics_data.json
          git commit -m "Auto update analytics data [skip ci]" || exit 0
          git push
