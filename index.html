<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MMEQZZ86BY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MMEQZZ86BY');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristiano A. Barbosa — Data Science & IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg: #050a0f; --surface: #0d1620; --surface2: #111d2c;
            --accent: #00d4ff; --accent2: #7b5cfa; --accent3: #00ffaa;
            --text: #e8f4fd; --muted: #6b8fa8; --border: rgba(0,212,255,0.15);
            --nav-bg: rgba(5, 10, 15, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); font-family: 'Syne', sans-serif; color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        /* --- NAVBAR --- */
        .navbar {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: var(--nav-bg); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 100px;
            padding: 10px 25px; display: flex; gap: 18px; z-index: 1000;
        }
        .nav-item { color: var(--text); text-decoration: none; transition: 0.3s; }
        .nav-item:hover { color: var(--accent); }

        /* --- CARD --- */
        .card {
            width: 950px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 24px; display: grid; grid-template-columns: 300px 1fr;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6); overflow: hidden;
        }

        .left {
            padding: 40px 24px; background: var(--surface2); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--accent); overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .name { text-align: center; font-size: 1.2rem; }
        .name span { display: block; font-size: 0.7rem; color: var(--accent); font-family: 'Space Mono'; }

        .right { padding: 30px; display: flex; flex-direction: column; gap: 20px; }

        /* --- DASHBOARD --- */
        .charts-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 15px; }
        .geo-widget { 
            grid-column: span 2; background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            border-radius: 15px; padding: 15px; min-height: 150px;
        }
        
        .chart-mini { 
            background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            border-radius: 15px; padding: 15px; display: flex; flex-direction: column; align-items: center;
        }

        .chart-title { font-size: 0.6rem; font-family: 'Space Mono'; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; width: 100%; }

        /* MAPA/LISTA DE CIDADES */
        .city-list { width: 100%; font-size: 0.75rem; font-family: 'Space Mono'; }
        .city-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .city-bar { height: 4px; background: var(--accent3); border-radius: 2px; margin-top: 4px; transition: width 1s; }

        .bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 50px; }
        .bar { width: 10px; background: var(--accent); border-radius: 1px; }

        .counter { font-size: 2rem; font-weight: bold; color: var(--accent3); font-family: 'Space Mono'; }

        .goal { font-size: 0.75rem; color: var(--muted); border-left: 2px solid var(--accent); padding-left: 10px; font-family: 'Space Mono'; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="https://www.linkedin.com/in/cristianoalves-ca/" target="_blank" class="nav-item"><i class="fab fa-linkedin"></i></a>
    <a href="https://github.com/Alvenato" target="_blank" class="nav-item"><i class="fab fa-github"></i></a>
    <a href="https://wa.me/5561981830780" target="_blank" class="nav-item"><i class="fab fa-whatsapp"></i></a>
    <div class="nav-divider"></div>
    <a href="https://alvenato.github.io/curriculo.html" target="_blank" class="nav-item" style="font-size: 0.7rem; font-family:'Space Mono'; color: var(--accent3)">SOBRE</a>
</nav>

<div class="card">
    <div class="left">
        <div class="avatar"><img src="https://github.com/Alvenato.png"></div>
        <div class="name">Cristiano A. Barbosa<span>Data Science & IA Student</span></div>
        <div class="goal">ETL Pipeline: Google Analytics API → Python → JSON → Portfolio Web</div>
    </div>

    <div class="right">
        <div class="charts-grid">
            <div class="geo-widget">
                <span class="chart-title"><i class="fas fa-globe-americas"></i> Localização dos Acessos (Top Cidades)</span>
                <div id="city-container" class="city-list">
                    <div class="city-item">Carregando dados globais...</div>
                </div>
            </div>

            <div class="chart-mini">
                <span class="chart-title">Acessos/Dia</span>
                <div class="bar-chart" id="histograma"></div>
            </div>

            <div class="chart-mini">
                <span class="chart-title">Total Usuários</span>
                <div class="counter" id="total-users">0</div>
            </div>
        </div>
    </div>
</div>

<script>
    async function updateDash() {
        try {
            const res = await fetch('analytics_data.json');
            const data = await res.json();

            // 1. Processar Cidades (Agrupamento)
            const cityMap = {};
            data.forEach(d => {
                cityMap[d.city] = (cityMap[d.city] || 0) + d.users;
            });
            const sortedCities = Object.entries(cityMap).sort((a,b) => b[1] - a[1]).slice(0, 3);
            
            const cityContainer = document.getElementById('city-container');
            cityContainer.innerHTML = '';
            sortedCities.forEach(([name, count]) => {
                const percentage = (count / data.reduce((a,b) => a + b.users, 0)) * 100;
                cityContainer.innerHTML += `
                    <div style="margin-bottom: 10px">
                        <div class="city-item"><span>${name}</span><span>${count} users</span></div>
                        <div class="city-bar" style="width: ${percentage}%"></div>
                    </div>
                `;
            });

            // 2. Histograma
            const recent = data.slice(-8);
            const maxVal = Math.max(...recent.map(d => d.users), 1);
            const hist = document.getElementById('histograma');
            recent.forEach(d => {
                hist.innerHTML += `<div class="bar" style="height:${(d.users/maxVal)*100}%"></div>`;
            });

            // 3. Total
            document.getElementById('total-users').innerText = data.reduce((s,d) => s + d.users, 0);

        } catch(e) { console.log("Erro ao carregar mapa."); }
    }
    updateDash();
</script>

</body>
</html>
