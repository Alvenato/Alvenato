    <style>
        :root {
            --bg: #050a0f;
            --surface: #0d1620;
            --surface2: #111d2c;
            --accent: #00d4ff;
            --accent2: #7b5cfa;
            --accent3: #00ffaa;
            --text: #e8f4fd;
            --muted: #6b8fa8;
            --border: rgba(0,212,255,0.15);
            --nav-bg: rgba(5, 10, 15, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Syne', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 100px 20px 20px 20px;
        }

        /* --- MENU ORIGINAL --- */
        .navbar {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 100px;
            padding: 10px 25px;
            display: flex;
            align-items: center;
            gap: 18px;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .nav-item {
            color: var(--text);
            text-decoration: none;
            font-size: 1.1rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        .nav-item:hover {
            color: var(--accent);
            transform: translateY(-2px);
        }

        .nav-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.1); margin: 0 5px; }

        .sobre-btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent3);
        }

        /* Fundo Animado Grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: orbFloat 8s ease-in-out infinite alternate;
            pointer-events: none;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; }
        .orb-2 { width: 350px; height: 350px; background: var(--accent2); bottom: -80px; right: -80px; }

        /* Card Layout */
        .card {
            position: relative;
            width: 880px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 300px 1fr;
            animation: cardReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            z-index: 10;
        }

        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(32px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .left {
            padding: 60px 24px;
            background: var(--surface2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .avatar-wrapper { position: relative; width: 130px; height: 130px; }
        .avatar-ring {
            position: absolute; inset: -6px; border-radius: 50%;
            background: conic-gradient(var(--accent), var(--accent2), var(--accent3), var(--accent));
            animation: spin 4s linear infinite;
            filter: blur(2px);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .avatar {
            position: relative; width: 130px; height: 130px; border-radius: 50%;
            overflow: hidden; border: 3px solid var(--bg); z-index: 1;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .name { font-size: 1.3rem; font-weight: 800; text-align: center; }
        .name span { display: block; font-size: 0.7rem; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; font-family: 'Space Mono', monospace; margin-top: 8px; }

        .skills-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 15px; }
        .skill-tag {
            padding: 4px 10px; border-radius: 6px; font-size: 0.65rem; font-weight: 600;
            font-family: 'Space Mono', monospace; border: 1px solid rgba(0,212,255,0.3); color: var(--accent);
        }

        .right { padding: 40px 32px; display: flex; flex-direction: column; gap: 24px; }

        /* Widgets Gráficos Originais */
        .charts-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .chart-widget { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); 
            border-radius: 12px; padding: 12px 8px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 10px; min-height: 100px;
        }
        .chart-title { font-size: 0.5rem; font-family: 'Space Mono', monospace; color: var(--muted); text-transform: uppercase; }

        .pie-chart { width: 35px; height: 35px; border-radius: 50%; background: conic-gradient(var(--accent) 0% 40%, var(--accent2) 40% 70%, var(--accent3) 70% 100%); animation: spin 4s linear infinite; }
        
        .bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 35px; }
        .bar { width: 6px; background: var(--accent); border-radius: 1px; animation: barGrow 1.5s ease-in-out infinite alternate; }
        @keyframes barGrow { from { height: 30%; } to { height: 100%; } }

        .radar-box { width: 35px; height: 35px; border: 1px solid var(--border); border-radius: 50%; position: relative; overflow: hidden; }
        .radar-sweep { position: absolute; width: 100%; height: 100%; background: conic-gradient(transparent, var(--accent3)); opacity: 0.3; animation: spin 2s linear infinite; }

        .code-block { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; font-family: 'Space Mono', monospace; font-size: 0.72rem; }
        .code-header { padding: 8px 16px; background: rgba(0,212,255,0.05); border-bottom: 1px solid var(--border); display: flex; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-r { background: #ff5f57; } .dot-y { background: #febc2e; } .dot-g { background: #28c840; }
        .code-body { padding: 14px 18px; line-height: 1.5; }
        .kw { color: #7b5cfa; } .str { color: #00d4ff; } .key { color: #00ffaa; }

        .goal { padding: 14px; background: linear-gradient(135deg, rgba(0,212,255,0.06), rgba(123,92,250,0.06)); border: 1px solid var(--border); border-radius: 12px; font-size: 0.75rem; color: var(--accent); font-family: 'Space Mono', monospace; text-align: center; }

        @media (max-width: 900px) {
            .card { grid-template-columns: 1fr; width: 100%; }
            .left { border-right: none; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
