    <style>
        :root {
            --bg: #030712;
            --surface: #0a1120;
            --surface2: #0f1a2e;
            --accent: #4ade80; 
            --accent2: #3b82f6; 
            --accent3: #6366f1; 
            --text: #f0f9ff;
            --muted: #94a3b8;
            --border: rgba(74, 222, 128, 0.2);
            --nav-bg: rgba(10, 17, 32, 0.85);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Syne', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 100px 20px 20px 20px;
        }

        /* --- MENU --- */
        .navbar {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 8px 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-item {
            color: var(--text);
            text-decoration: none;
            font-size: 1.1rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        .nav-item:hover { color: var(--accent); transform: translateY(-2px); }

        .sobre-container {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 15px;
        }

        .sobre-icon-img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .nav-item.sobre-text {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Fundo Animado */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(74, 222, 128, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        /* Card Layout */
        .card {
            position: relative;
            width: 880px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 300px 1fr;
            animation: cardReveal 0.8s ease-out;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            z-index: 10;
        }

        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .left {
            padding: 60px 24px;
            background: var(--surface2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .avatar-wrapper { position: relative; width: 130px; height: 130px; }
        .avatar-ring {
            position: absolute; inset: -6px; border-radius: 50%;
            background: conic-gradient(var(--accent), var(--accent2), var(--accent3), var(--accent));
            animation: spin 4s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .avatar { position: relative; width: 130px; height: 130px; border-radius: 50%; overflow: hidden; border: 3px solid var(--bg); z-index: 1; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .name { font-size: 1.3rem; font-weight: 800; text-align: center; }
        .name span { display: block; font-size: 0.7rem; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; font-family: 'Space Mono', monospace; margin-top: 8px; }

        .skill-tag {
            padding: 4px 10px; border-radius: 6px; font-size: 0.65rem; font-family: 'Space Mono', monospace;
            border: 1px solid var(--border); background: rgba(74, 222, 128, 0.05); color: var(--accent);
        }

        .right { padding: 40px 32px; display: flex; flex-direction: column; gap: 24px; }

        /* Widgets de Gráficos */
        .charts-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .chart-widget { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); 
            border-radius: 12px; padding: 15px 10px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 8px; min-height: 100px;
        }
        .chart-title { font-size: 0.5rem; font-family: 'Space Mono', monospace; color: var(--muted); text-transform: uppercase; }

        .pie-chart { width: 35px; height: 35px; border-radius: 50%; background: conic-gradient(var(--accent) 0% 40%, var(--accent2) 40% 70%, var(--accent3) 70% 100%); animation: spin 4s linear infinite; }
        
        .bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 35px; }
        .bar { width: 6px; background: var(--accent2); border-radius: 1px; animation: barGrow 1.5s ease-in-out infinite alternate; }
        @keyframes barGrow { from { height: 30%; } to { height: 100%; } }

        .radar-sweep-box { width: 35px; height: 35px; border: 1px solid var(--border); border-radius: 50%; position: relative; overflow: hidden; }
        .radar-sweep { position: absolute; width: 100%; height: 100%; background: conic-gradient(transparent, var(--accent)); opacity: 0.4; animation: spin 2s linear infinite; }

        .code-block { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; font-family: 'Space Mono', monospace; font-size: 0.72rem; }
        .code-header { padding: 8px 16px; background: rgba(74, 222, 128, 0.05); border-bottom: 1px solid var(--border); display: flex; gap: 6px; }
        .code-body { padding: 14px 18px; line-height: 1.5; }
        .kw { color: var(--accent3); } .str { color: var(--accent); } .key { color: var(--accent2); }

        .goal { padding: 14px; background: rgba(74, 222, 128, 0.05); border: 1px solid var(--border); border-radius: 12px; font-size: 0.75rem; color: var(--accent); font-family: 'Space Mono', monospace; text-align: center; }

        @media (max-width: 900px) {
            .card { grid-template-columns: 1fr; width: 100%; }
            .navbar { width: 95%; padding: 8px 15px; }
        }
    </style>
</head>
