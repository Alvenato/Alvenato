<style>
    /* RESET E CORES DO DASHBOARD */
    :root {
        --accent: #00ff00; /* Verde Neon */
        --accent3: #0088ff; /* Azul */
        --bg-card: rgba(255, 255, 255, 0.05);
        --text-dim: #888;
    }

    .right {
        padding: 20px;
        color: white;
        font-family: 'Space Mono', monospace;
    }

    .charts-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-top: 20px;
    }

    .chart-widget {
        background: var(--bg-card);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 8px;
    }

    .chart-title {
        font-size: 0.6rem;
        text-transform: uppercase;
        color: var(--text-dim);
        display: block;
        margin-bottom: 10px;
    }

    .counter-val {
        font-size: 2rem;
        color: var(--accent);
        font-weight: bold;
    }

    /* BARRAS DE CIDADES */
    .progress-container { margin-bottom: 12px; }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.6rem; margin-bottom: 4px; }
    .progress-bar-bg { background: #222; height: 6px; width: 100%; border-radius: 3px; }
    .progress-bar-fill { background: var(--accent); height: 100%; border-radius: 3px; }

    /* HISTOGRAMA */
    .bar-chart {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        height: 50px;
    }
    .bar { width: 10%; background: var(--accent3); border-radius: 2px 2px 0 0; }

    .mini-data { font-size: 0.7rem; line-height: 1.6; }
    
    /* Layout para as cidades ocuparem mais espaço */
    .full-row { grid-column: span 3; }

    .goal {
        margin-top: 20px;
        font-size: 0.7rem;
        border-top: 1px solid #333;
        padding-top: 10px;
    }
</style>

<div class="right">
    <div class="code-block" style="background: #111; padding: 10px; border-radius: 5px; border-left: 3px solid var(--accent); margin-bottom: 20px;">
        <div style="color: var(--text-dim); font-size: 0.7rem;">
            const pipeline = <span style="color: var(--accent)">"GA4 → Python → GitHub"</span>;<br>
            const status = <span style="color: var(--accent)">"Live Data Active"</span>;
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-widget">
            <span class="chart-title">USUÁRIOS (30D)</span>
            <div class="counter-val" id="total-users">0</div>
        </div>

        <div class="chart-widget">
            <span class="chart-title">TECH STACK</span>
            <div id="device-info" class="mini-data"></div>
        </div>

        <div class="chart-widget">
            <span class="chart-title">VOLUME DIÁRIO</span>
            <div class="bar-chart" id="histograma"></div>
        </div>

        <div class="chart-widget full-row">
            <span class="chart-title">TOP LOCALIDADES</span>
            <div id="city-ranking"></div>
        </div>

        <div class="chart-widget">
            <span class="chart-title">TOP CONTENT</span>
            <div id="top-pages" class="mini-data"></div>
        </div>

        <div class="chart-widget">
            <span class="chart-title">ALCANCE GLOBAL</span>
            <div id="country-stats" class="mini-data"></div>
        </div>
    </div>

    <div class="goal">
        <span style="color: var(--accent)">▶</span> <b>Data Pipeline Status:</b> <span style="color: #00ff00;">Operational</span> | Atualizado automaticamente.
    </div>
</div>
