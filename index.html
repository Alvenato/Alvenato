<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MMEQZZ86BY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MMEQZZ86BY');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristiano A. Barbosa — Portfolio</title>
    
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg: #03070a;
            --surface: #0a1118;
            --surface2: #0d1620;
            --neon-blue: #00f2ff;
            --neon-purple: #7000ff;
            --neon-orange: #ff8c00;
            --neon-green: #39ff14;
            --text: #e8f4fd;
            --muted: #5d7a8c;
            --border: rgba(0, 242, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); font-family: 'Syne', sans-serif; color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; overflow-x: hidden; }

        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(112, 0, 255, 0.05) 1px, transparent 1px);
            background-size: 45px 45px; animation: gridMove 20s linear infinite; pointer-events: none;
        }
        @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(45px); } }

        .card {
            position: relative; width: 900px; background: var(--surface); border: 1px solid var(--neon-blue); border-radius: 24px;
            display: grid; grid-template-columns: 320px 1fr; box-shadow: 0 0 40px rgba(0, 242, 255, 0.1); z-index: 10; overflow: hidden;
        }

        .left { padding: 40px 30px; background: var(--surface2); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 20px; }
        
        .avatar-wrapper { position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; }
        .avatar-ring { 
            position: absolute; width: 150px; height: 150px; border-radius: 50%; 
            background: conic-gradient(var(--neon-blue), var(--neon-purple), var(--neon-orange), var(--neon-green), var(--neon-blue)); 
            animation: spin 6s linear infinite; filter: blur(4px); z-index: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .avatar { position: relative; width: 140px; height: 140px; border-radius: 50%; overflow: hidden; border: 3px solid var(--surface2); z-index: 1; background: var(--surface2); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .name { font-size: 1.4rem; font-weight: 800; text-align: center; }
        .sub-name { display: block; font-size: 0.7rem; color: var(--neon-blue); font-family: 'Space Mono', monospace; text-transform: uppercase; margin-top: 8px; letter-spacing: 2px; text-align: center; }

        .social-links { display: flex; gap: 20px; margin: 10px 0; }
        .social-links a { font-size: 1.4rem; transition: 0.3s; }
        .fa-linkedin { color: #0077b5; } .fa-github { color: #fff; } .fa-whatsapp { color: var(--neon-green); } .fa-envelope { color: var(--neon-orange); }

        .skill-tag { padding: 5px 10px; border-radius: 6px; font-size: 0.6rem; font-weight: bold; font-family: 'Space Mono', monospace; border: 1px solid; background: rgba(0,0,0,0.5); text-transform: uppercase; }
        .skill-blue { color: var(--neon-blue); border-color: var(--neon-blue); }
        .skill-purple { color: var(--neon-purple); border-color: var(--neon-purple); }
        .skill-orange { color: var(--neon-orange); border-color: var(--neon-orange); }
        .skill-green { color: var(--neon-green); border-color: var(--neon-green); }

        .status-left { margin-top: auto; display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--neon-green); text-transform: uppercase; }
        .pulse-dot { width: 6px; height: 6px; background-color: var(--neon-green); border-radius: 50%; box-shadow: 0 0 10px var(--neon-green); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .right { padding: 40px; display: flex; flex-direction: column; gap: 15px; }
        .data-source-info { background: rgba(0, 0, 0, 0.3); border: 1px dashed var(--neon-purple); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; }
        .data-source-info i { color: var(--neon-purple); }
        
        .metric-card { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }
        .label { font-size: 0.55rem; color: var(--muted); text-transform: uppercase; font-family: 'Space Mono', monospace; display: block; margin-bottom: 8px; }
        .value { font-size: 2.2rem; font-weight: 800; color: var(--neon-blue); font-family: 'Space Mono', monospace; text-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }

        #city-ranking { max-height: 150px; overflow-y: auto; padding-right: 5px; }
        #city-ranking::-webkit-scrollbar { width: 3px; }
        #city-ranking::-webkit-scrollbar-thumb { background: var(--neon-blue); }

        @media (max-width: 900px) { .card { grid-template-columns: 1fr; width: 100%; } .left { border-right: none; } }
    </style>
</head>
<body>

<div class="card">
    <div class="left">
        <div class="avatar-wrapper">
            <div class="avatar-ring"></div>
            <div class="avatar"><img src="https://github.com/Alvenato.png" alt="Cristiano"></div>
        </div>
        <div class="name-container">
            <h1 class="name">Cristiano A. Barbosa</h1>
            <span class="sub-name">Cientista de Dados & IA</span>
        </div>
        <div class="social-links">
            <a href="https://www.linkedin.com/in/cristianoalves-ca/" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="https://github.com/Alvenato" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://wa.me/5561981830780" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="mailto:analytics.barbosa@gmail.com"><i class="fas fa-envelope"></i></a>
        </div>
        <div class="skills-container" style="width: 100%;">
            <span class="label" style="text-align: center;">Habilidades</span>
            <div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px;">
                <span class="skill-tag skill-blue">Python</span>
                <span class="skill-tag skill-purple">SQL</span>
                <span class="skill-tag skill-orange">ETL</span>
                <span class="skill-tag skill-green">Power BI</span>
                <span class="skill-tag skill-blue">Tableau</span>
                <span class="skill-tag skill-purple">Docker</span>
                <span class="skill-tag skill-orange">Figma</span>
            </div>
        </div>
        <div class="status-left">
            <div class="pulse-dot"></div>
            <span>Atualização de hora em hora</span>
        </div>
    </div>

    <div class="right">
        <div class="data-source-info">
            <i class="fas fa-satellite-dish"></i>
            <p style="font-size: 0.65rem; font-family: 'Space Mono';">Métricas via GA4 (Google Analytics).</p>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
            <div class="metric-card"><span class="label">Total Visitantes</span><div class="value" id="total-users">--</div></div>
            <div class="metric-card"><span class="label">Dispositivos</span><div id="tech_stack_pie" style="height: 60px;"></div></div>
            <div class="metric-card"><span class="label">Tendência (7d)</span><div id="tendencia_chart" style="height: 45px;"></div></div>
            <div class="metric-card" style="grid-column: span 3;"><span class="label">Distribuição Geográfica</span><div id="regions_div" style="height: 180px;"></div></div>
            <div class="metric-card" style="grid-column: span 3;"><span class="label">Origem Local</span><div id="city-ranking"></div></div>
        </div>
    </div>
</div>

<script>
const NEON_BLUE = '#00f2ff', NEON_PURPLE = '#7000ff', NEON_ORANGE = '#ff8c00', NEON_GREEN = '#39ff14';
google.charts.load('current', {'packages':['geochart', 'corechart']});
google.charts.setOnLoadCallback(updateDashboard);

async function updateDashboard() {
    try {
        const response = await fetch('analytics_data.json?t=' + Date.now());
        const data = await response.json();
        if (!data) return;
        const total = data.reduce((sum, d) => sum + (d.users || 0), 0);
        document.getElementById('total-users').innerText = total;

        const cities = {}; data.forEach(d => { cities[d.city] = (cities[d.city] || 0) + d.users; });
        document.getElementById('city-ranking').innerHTML = Object.entries(cities).sort((a,b)=>b[1]-a[1]).map(([n, c]) => `
            <div style="margin-bottom:10px;">
                <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:var(--muted); font-family:'Space Mono'"><span>${n}</span><span>${c}</span></div>
                <div style="background:rgba(255,255,255,0.05); height:4px; margin-top:3px; border-radius:2px; overflow:hidden;">
                    <div style="width:${(c/total)*100}%; height:100%; background: linear-gradient(90deg, ${NEON_BLUE}, ${NEON_GREEN})"></div>
                </div>
            </div>
        `).join('');
        drawCharts(data);
    } catch (e) { console.error("Dados não encontrados."); }
}

function drawCharts(data) {
    new google.visualization.PieChart(document.getElementById('tech_stack_pie')).draw(
        google.visualization.arrayToDataTable([['D', 'U'], ['Desk', 70], ['Mob', 30]]),
        { backgroundColor: 'transparent', colors: [NEON_BLUE, NEON_PURPLE], pieHole: 0.5, legend: 'none', pieSliceBorderColor: 'transparent', chartArea: {width: '100%', height: '100%'} }
    );
    new google.visualization.LineChart(document.getElementById('tendencia_chart')).draw(
        google.visualization.arrayToDataTable([['D', 'U'], ['1', 5], ['2', 15], ['3', 10], ['4', 20], ['5', 18], ['6', 25]]),
        { backgroundColor: 'transparent', colors: [NEON_ORANGE], legend: 'none', chartArea: {width: '100%', height: '100%'}, hAxis: {textPosition: 'none', gridlines: {color: 'transparent'}}, vAxis: {textPosition: 'none', gridlines: {color: 'transparent'}}, lineWidth: 3 }
    );
    new google.visualization.GeoChart(document.getElementById('regions_div')).draw(
        google.visualization.arrayToDataTable([['Country', 'Users'], ['Brazil', 100]]),
        { backgroundColor: 'transparent', datalessRegionColor: '#0d1620', colorAxis: {colors: ['#002233', NEON_BLUE]}, legend: 'none' }
    );
}
</script>
</body>
</html>
