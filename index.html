<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MMEQZZ86BY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MMEQZZ86BY');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristiano A. Barbosa — Data Science & IA</title>
    
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg: #03070a;
            --surface: #0d1620;
            --surface2: #111d2c;
            --accent: #00f2ff;   /* Cyan */
            --accent2: #9d76ff;  /* Violeta */
            --accent3: #00ffa2;  /* Verde Neon */
            --text: #e8f4fd;
            --muted: #6b8fa8;
            --border: rgba(0, 242, 255, 0.15);
            --nav-bg: rgba(5, 10, 15, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Syne', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 100px 20px 40px 20px;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(40px); } }

        .navbar {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: var(--nav-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--accent); border-radius: 100px;
            padding: 10px 25px; display: flex; align-items: center; gap: 18px; z-index: 1000;
        }

        .nav-item { color: var(--text); text-decoration: none; font-size: 1.1rem; transition: 0.3s; }
        .nav-item:hover { color: var(--accent); }

        .card {
            position: relative; width: 900px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 24px;
            display: grid; grid-template-columns: 320px 1fr;
            box-shadow: 0 0 40px rgba(0,0,0,0.6); z-index: 10; overflow: hidden;
        }

        .left { padding: 60px 30px; background: var(--surface2); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 35px; }
        
        .avatar-wrapper { position: relative; width: 140px; height: 140px; }
        .avatar-ring { 
            position: absolute; inset: -5px; border-radius: 50%; 
            background: conic-gradient(var(--accent), var(--accent2), var(--accent3), var(--accent)); 
            animation: spin 4s linear infinite; filter: blur(2px);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .avatar { position: relative; width: 140px; height: 140px; border-radius: 50%; overflow: hidden; border: 4px solid var(--surface2); z-index: 1; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .name { font-size: 1.4rem; font-weight: 800; text-align: center; }
        .sub-name { display: block; font-size: 0.7rem; color: var(--accent); font-family: 'Space Mono', monospace; text-transform: uppercase; margin-top: 8px; letter-spacing: 2px; text-align: center; }

        .skills-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .skill-tag { padding: 5px 12px; border-radius: 6px; font-size: 0.65rem; font-weight: bold; font-family: 'Space Mono', monospace; border: 1px solid; background: rgba(0,0,0,0.4); text-transform: uppercase; }
        .skill-python { color: var(--accent); border-color: var(--accent); }
        .skill-sql { color: var(--accent2); border-color: var(--accent2); }
        .skill-powerbi { color: var(--accent3); border-color: var(--accent3); }

        .right { padding: 40px; display: flex; flex-direction: column; gap: 25px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .metric-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 18px; }
        
        .label { font-size: 0.55rem; color: var(--muted); text-transform: uppercase; font-family: 'Space Mono', monospace; margin-bottom: 10px; }
        .value { font-size: 2.2rem; font-weight: 800; color: var(--accent3); font-family: 'Space Mono', monospace; }

        .bar-chart { display: flex; align-items: flex-end; justify-content: space-between; height: 45px; gap: 4px; }
        .bar { flex: 1; background: var(--accent); border-radius: 2px; transition: 0.3s; }
        .bar:hover { background: var(--accent2); }

        .progress-fill { background: linear-gradient(90deg, var(--accent), var(--accent3)); height: 100%; border-radius: 4px; }

        /* Customização dos Tooltips do Google Charts */
        .google-visualization-tooltip {
            border: 1px solid var(--accent) !important;
            background-color: var(--surface2) !important;
            padding: 8px !important;
            font-family: 'Space Mono', monospace !important;
            font-size: 10px !important;
            color: var(--text) !important;
            border-radius: 8px !important;
            box-shadow: none !important;
        }

        @media (max-width: 900px) {
            .card { grid-template-columns: 1fr; width: 100%; }
            .left { border-right: none; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="https://www.linkedin.com/in/cristianoalves-ca/" target="_blank" class="nav-item"><i class="fab fa-linkedin"></i></a>
    <a href="https://github.com/Alvenato" target="_blank" class="nav-item"><i class="fab fa-github"></i></a>
    <a href="https://wa.me/5561981830780" target="_blank" class="nav-item"><i class="fab fa-whatsapp"></i></a>
    <a href="mailto:analytics.barbosa@gmail.com" class="nav-item"><i class="fas fa-envelope"></i></a>
</nav>

<div class="card">
    <div class="left">
        <div class="avatar-wrapper">
            <div class="avatar-ring"></div>
            <div class="avatar"><img src="https://github.com/Alvenato.png" alt="Cristiano A. Barbosa"></div>
        </div>
        <div class="name-container">
            <h1 class="name">Cristiano A. Barbosa</h1>
            <span class="sub-name">Cientista de Dados & IA</span>
        </div>
        <div class="skills-grid">
            <span class="skill-tag skill-python">Python</span>
            <span class="skill-tag skill-sql">SQL</span>
            <span class="skill-tag skill-powerbi">Power BI</span>
        </div>
    </div>

    <div class="right">
        <div class="dashboard-grid">
            <div class="metric-card">
                <span class="label">Visitantes (30D)</span>
                <div class="value" id="total-users">0</div>
            </div>
            <div class="metric-card">
                <span class="label">Dispositivos</span>
                <div id="tech_stack_pie" style="height: 60px;"></div>
            </div>
            <div class="metric-card">
                <span class="label">Tendência</span>
                <div class="bar-chart" id="histograma"></div>
            </div>
            <div class="metric-card" style="grid-column: span 3;">
                <span class="label">Distribuição Global</span>
                <div id="regions_div" style="height: 180px;"></div>
            </div>
            <div class="metric-card" style="grid-column: span 3;">
                <span class="label">Top Localidades</span>
                <div id="city-ranking"></div>
            </div>
        </div>
    </div>
</div>

<script>
google.charts.load('current', {'packages':['geochart', 'corechart']});

async function updateDashboard() {
    try {
        const response = await fetch('analytics_data.json?t=' + Date.now());
        const data = await response.json();
        if (!data || data.length === 0) return;

        const totalUsers = data.reduce((sum, d) => sum + d.users, 0);
        document.getElementById('total-users').innerText = totalUsers;

        // Histograma Simples
        const last7 = data.slice(-7);
        const max = Math.max(...last7.map(d => d.users), 1);
        document.getElementById('histograma').innerHTML = last7.map(d => 
            `<div class="bar" style="height:${(d.users/max)*100}%" title="Usuários: ${d.users}"></div>`
        ).join('');

        // Ranking de Cidades
        const topCities = data.slice(0, 3);
        document.getElementById('city-ranking').innerHTML = topCities.map(d => `
            <div style="margin-bottom:10px;">
                <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:var(--muted); margin-bottom:4px;"><span>${d.city}</span></div>
                <div style="background:rgba(255,255,255,0.05); height:6px; border-radius:3px; overflow:hidden;">
                    <div class="progress-fill" style="width:${(d.users/totalUsers)*100}%;"></div>
                </div>
            </div>
        `).join('');

        google.charts.setOnLoadCallback(() => { drawPie(data); drawMap(data); });
    } catch (e) { console.error(e); }
}

function drawPie(data) {
    const options = {
        backgroundColor: 'transparent',
        colors: ['#00f2ff', '#9d76ff'], // Cyan e Violeta
        pieHole: 0.5, legend: 'none', pieSliceBorderColor: 'transparent',
        tooltip: { textStyle: { fontName: 'Space Mono', fontSize: 10 } },
        chartArea: {width: '90%', height: '90%'}
    };
    const pieData = google.visualization.arrayToDataTable([['Task', 'Val'],['Desktop', 70],['Mobile', 30]]);
    new google.visualization.PieChart(document.getElementById('tech_stack_pie')).draw(pieData, options);
}

function drawMap(data) {
    const options = {
        backgroundColor: 'transparent',
        datalessRegionColor: '#111d2c',
        colorAxis: {colors: ['#0d1620', '#00f2ff']}, // Fundo para Cyan
        legend: 'none',
        tooltip: { textStyle: { fontName: 'Space Mono', fontSize: 10 } }
    };
    const mapData = google.visualization.arrayToDataTable([['Country', 'Users'],['Brazil', 100]]);
    new google.visualization.GeoChart(document.getElementById('regions_div')).draw(mapData, options);
}

updateDashboard();
</script>

</body>
</html>
