    <style>
        :root {
            /* Cores extraídas do seu ícone */
            --bg: #030712;
            --surface: #0a1120;
            --surface2: #0f1a2e;
            --accent: #4ade80; /* Verde Água / Ciano claro */
            --accent2: #3b82f6; /* Azul Médio */
            --accent3: #6366f1; /* Azul Indigo/Royal */
            --text: #f0f9ff;
            --muted: #94a3b8;
            --border: rgba(74, 222, 128, 0.2);
            --nav-bg: rgba(10, 17, 32, 0.85);
            --gradient-main: linear-gradient(135deg, #4ade80, #3b82f6, #6366f1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Syne', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 100px 20px 20px 20px;
        }

        /* --- MENU --- */
        .navbar {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 100px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-item {
            color: var(--text);
            text-decoration: none;
            font-size: 1.2rem;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            opacity: 0.8;
        }

        .nav-item:hover {
            color: var(--accent);
            transform: translateY(-2px);
            opacity: 1;
        }

        /* Botão Sobre Personalizado com a Imagem */
        .sobre-container {
            display: flex;
            align-items: center;
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 15px;
        }

        .sobre-icon-img {
            width: 24px;
            height: 24px;
            margin-right: 8px;
            transition: 0.3s;
        }

        .nav-item.sobre-text {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .navbar:hover .sobre-icon-img {
            filter: brightness(1.2);
        }

        /* Fundo Animado inspirado no ícone */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(74, 222, 128, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 25s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 50px 50px; }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            animation: orbFloat 10s ease-in-out infinite alternate;
            pointer-events: none;
        }
        .orb-1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -100px; }
        .orb-2 { width: 450px; height: 450px; background: var(--accent3); bottom: -100px; right: -50px; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.2); }
        }

        /* Card Layout */
        .card {
            position: relative;
            width: 880px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 320px 1fr;
            animation: cardReveal 1s cubic-bezier(0.16, 1, 0.3, 1) both;
            box-shadow: 0 50px 100px rgba(0,0,0,0.7);
            z-index: 10;
        }

        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .left {
            padding: 60px 30px;
            background: var(--surface2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 35px;
        }

        .avatar-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
        }

        .avatar-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent), var(--accent2), var(--accent3), var(--accent));
            animation: spin 6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .avatar {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--bg);
            z-index: 1;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .name { font-size: 1.4rem; font-weight: 800; text-align: center; }
        .name span {
            display: block;
            font-size: 0.75rem;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Space Mono', monospace;
            margin-top: 10px;
        }

        .skill-tag {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            border: 1px solid rgba(74, 222, 128, 0.3);
            background: rgba(74, 222, 128, 0.05);
            color: var(--accent);
        }

        .right { padding: 45px; display: flex; flex-direction: column; gap: 30px; }

        .code-block { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            font-family: 'Space Mono', monospace; 
            font-size: 0.75rem; 
        }

        .code-header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-r { background: #ff5f57; } .dot-y { background: #febc2e; } .dot-g { background: #28c840; }
        
        .code-body { padding: 20px; line-height: 1.6; }
        .kw { color: var(--accent); }
        .str { color: var(--accent2); }
        .key { color: var(--text); }

        .chart-widget { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid var(--border); 
            border-radius: 15px; 
            padding: 15px; 
            text-align: center;
        }

        .pie-chart { 
            width: 40px; height: 40px; margin: 10px auto; border-radius: 50%; 
            background: conic-gradient(var(--accent) 0% 30%, var(--accent2) 30% 70%, var(--accent3) 70% 100%);
            animation: pieRotate 5s linear infinite;
        }

        .goal { 
            padding: 18px; 
            background: linear-gradient(90deg, rgba(74, 222, 128, 0.1), rgba(99, 102, 241, 0.1)); 
            border: 1px solid var(--border); 
            border-radius: 15px; 
            font-size: 0.8rem; 
            color: var(--accent); 
            font-family: 'Space Mono', monospace; 
            text-align: center;
        }

        @media (max-width: 900px) {
            .card { grid-template-columns: 1fr; width: 100%; }
            .left { border-right: none; border-bottom: 1px solid var(--border); }
            .navbar { width: 95%; gap: 12px; }
        }
    </style>

<script>
    async function updateCounter() {
        const countElement = document.getElementById('count');
        const namespace = "cristiano_alves_stats"; 
        try {
            const response = await fetch(`https://api.counterapi.dev/v1/${namespace}/visits/up`);
            const data = await response.json();
            if (data.count) { animateCount(countElement, data.count); }
        } catch (e) { countElement.innerText = "1,450"; }
    }

    function animateCount(el, target) {
        let current = 0;
        const increment = target / 50;
        const timer = setInterval(() => {
            current += increment;
            if (current >= target) {
                el.innerText = Math.floor(target).toLocaleString();
                clearInterval(timer);
            } else {
                el.innerText = Math.floor(current).toLocaleString();
            }
        }, 30);
    }
    updateCounter();
</script>
