<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MMEQZZ86BY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MMEQZZ86BY');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristiano A. Barbosa — Data Science & IA</title>
    
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg: #03070a;
            --surface: #0a1118;
            --surface2: #0d1620;
            --neon-blue: #00f2ff;
            --neon-purple: #7000ff;
            --neon-orange: #ff8c00;
            --neon-green: #39ff14;
            --text: #e8f4fd;
            --muted: #5d7a8c;
            --border: rgba(0, 242, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); font-family: 'Syne', sans-serif; color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }

        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 45px 45px; animation: gridMove 20s linear infinite; pointer-events: none; z-index: 0;
        }
        @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(45px); } }

        .card {
            position: relative; width: 900px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
            display: grid; grid-template-columns: 320px 1fr; box-shadow: 0 0 50px rgba(0,0,0,0.8), 0 0 15px rgba(0, 242, 255, 0.1); z-index: 10; overflow: hidden;
        }

        .left { padding: 40px 30px; background: var(--surface2); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .avatar-wrapper { position: relative; width: 140px; height: 140px; }
        .avatar-ring { position: absolute; inset: -5px; border-radius: 50%; background: conic-gradient(var(--neon-blue), var(--neon-purple), var(--neon-green), var(--neon-blue)); animation: spin 4s linear infinite; filter: blur(2px); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .avatar { position: relative; width: 140px; height: 140px; border-radius: 50%; overflow: hidden; border: 4px solid var(--surface2); z-index: 1; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .name-container { text-align: center; }
        .name { font-size: 1.4rem; font-weight: 800; }
        .sub-name { display: block; font-size: 0.7rem; color: var(--neon-blue); font-family: 'Space Mono', monospace; text-transform: uppercase; margin-top: 8px; letter-spacing: 2px; }

        .social-links { display: flex; gap: 20px; margin: 5px 0; }
        .social-links a { font-size: 1.4rem; transition: 0.3s ease; text-decoration: none; }
        .fa-linkedin { color: #0077b5; } .fa-github { color: #e6edf3; } .fa-whatsapp { color: #25d366; } .fa-envelope { color: #ea4335; }

        .skills-container { width: 100%; text-align: center; margin-top: 10px; }
        .skills-title { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; font-family: 'Space Mono', monospace; margin-bottom: 12px; display: block; }
        .skills-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .skill-tag { padding: 5px 10px; border-radius: 6px; font-size: 0.6rem; font-weight: bold; font-family: 'Space Mono', monospace; border: 1px solid; background: rgba(0,0,0,0.4); text-transform: uppercase; }
        .skill-blue { color: var(--neon-blue); border-color: var(--neon-blue); }
        .skill-purple { color: var(--neon-purple); border-color: var(--neon-purple); }
        .skill-orange { color: var(--neon-orange); border-color: var(--neon-orange); }
        .skill-green { color: var(--neon-green); border-color: var(--neon-green); }

        .status-left { margin-top: auto; display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--neon-green); text-transform: uppercase; padding-top: 20px; }
        .pulse-dot { width: 6px; height: 6px; background-color: var(--neon-green); border-radius: 50%; box-shadow: 0 0 10px var(--neon-green); animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }

        /* AJUSTE NO CAMPO DA ANTENA */
        .right { padding: 40px; display: flex; flex-direction: column; gap: 15px; }
        .data-source-info { 
            background: rgba(0, 0, 0, 0.2); 
            border: 1px dashed var(--neon-blue); 
            border-radius: 12px; 
            padding: 12px 18px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 5px; 
        }
        .data-source-info i { color: var(--neon-blue); font-size: 1.1rem; }
        .data-source-info p { font-size: 0.7rem; color: var(--text); line-height: 1.4; font-family: 'Space Mono', monospace; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .metric-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 12px; padding: 18px; transition: 0.3s; }
        .metric-card:hover { border-color: var(--neon-blue); background: rgba(0, 242, 255, 0.05); }

        .label { font-size: 0.55rem; color: var(--muted); text-transform: uppercase; font-family: 'Space Mono', monospace; margin-bottom: 10px; }
        .value { font-size: 2.2rem; font-weight: 800; color: var(--neon-blue); font-family: 'Space Mono', monospace; text-shadow: 0 0 12px rgba(0, 242, 255, 0.4); }

        .scrollable-metrics { max-height: 160px; overflow-y: auto; padding-right: 10px; margin-top: 5px; }
        .scrollable-metrics::-webkit-scrollbar { width: 4px; }
        .scrollable-metrics::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        @media (max-width: 900px) { .card { grid-template-columns: 1fr; width: 100%; } .left { border-right: none; border-bottom: 1px solid var(--border); } }
    </style>
</head>
<body>

<div class="card">
    <div class="left">
        <div class="avatar-wrapper">
            <div class="avatar-ring"></div>
            <div class="avatar"><img src="https://github.com/Alvenato.png" alt="Cristiano A. Barbosa"></div>
        </div>
        <div class="name-container">
            <h1 class="name">Cristiano A. Barbosa</h1>
            <span class="sub-name">Cientista de Dados & IA</span>
        </div>
        <div class="social-links">
            <a href="https://www.linkedin.com/in/cristianoalves-ca/" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="https://github.com/Alvenato" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://wa.me/5561981830780" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="mailto:analytics.barbosa@gmail.com"><i class="fas fa-envelope"></i></a>
        </div>
        <div class="skills-container">
            <span class="skills-title">Habilidades</span>
            <div class="skills-grid">
                <span class="skill-tag skill-blue">Python</span>
                <span class="skill-tag skill-purple">SQL</span>
                <span class="skill-tag skill-orange">ETL</span>
                <span class="skill-tag skill-green">Power BI</span>
                <span class="skill-tag skill-blue">Tableau</span>
                <span class="skill-tag skill-purple">Docker</span>
                <span class="skill-tag skill-orange">Figma</span>
            </div>
        </div>
        <div class="status-left">
            <div class="pulse-dot"></div>
            <span>Atualização de hora em hora</span>
        </div>
    </div>

    <div class="right">
        <div class="data-source-info">
            <i class="fas fa-satellite-dish"></i>
            <p>Métricas de tráfego integradas via GA4 (Google Analytics).</p>
        </div>
        <div class="dashboard-grid">
            <div class="metric-card">
                <span class="label">Total Visitantes</span>
                <div class="value" id="total-users">--</div>
            </div>
            <div class="metric-card">
                <span class="label">Dispositivos</span>
                <div id="tech_stack_pie" style="height: 60px;"></div>
            </div>
            <div class="metric-card">
                <span class="label">Tendência (7d)</span>
                <div id="tendencia_chart" style="height: 45px;"></div>
            </div>
            <div class="metric-card" style="grid-column: span 3; min-height: 220px;">
                <span class="label">Distribuição Geográfica</span>
                <div id="regions_div" style="height: 180px;"></div>
            </div>
            <div class="metric-card" style="grid-column: span 3;">
                <span class="label">Origem por Localidade</span>
                <div id="city-ranking" class="scrollable-metrics"></div>
            </div>
        </div>
    </div>
</div>

<script>
const NEON_BLUE = '#00f2ff';
google.charts.load('current', {'packages':['geochart', 'corechart']});
google.charts.setOnLoadCallback(updateDashboard);

async function updateDashboard() {
    try {
        const response = await fetch('analytics_data.json?t=' + Date.now());
        const data = await response.json();
        if (!data || data.length === 0) return;
        const totalUsers = data.reduce((sum, d) => sum + (d.users || 0), 0);
        document.getElementById('total-users').innerText = totalUsers;

        const cityMap = {};
        data.forEach(d => {
            const city = d.city || "Desconhecido";
            cityMap[city] = (cityMap[city] || 0) + d.users;
        });
        const allCities = Object.entries(cityMap).sort((a,b) => b[1]-a[1]);
        document.getElementById('city-ranking').innerHTML = allCities.map(([name, count]) => `
            <div style="margin-bottom:12px;">
                <div style="display:flex; justify-content:space-between; font-size:0.65rem; color:var(--muted); margin-bottom:4px; font-family:'Space Mono'">
                    <span>${name}</span><span>${count}</span>
                </div>
                <div style="background:rgba(255,255,255,0.05); height:6px; border-radius:3px; overflow:hidden;">
                    <div style="width:${(count/totalUsers)*100}%; height:100%; background: linear-gradient(90deg, ${NEON_BLUE}, #39ff14)"></div>
                </div>
            </div>
        `).join('');

        drawPie(data); drawMap(data); drawTendencia(data);
    } catch (e) { console.error(e); }
}

function drawTendencia(data) {
    const dateMap = {};
    data.forEach(d => {
        const raw = d.date.toString();
        const fullDate = `${raw.substring(6,8)}/${raw.substring(4,6)}/${raw.substring(0,4)}`;
        dateMap[fullDate] = (dateMap[fullDate] || 0) + d.users;
    });
    const last7 = Object.entries(dateMap).slice(-7);
    const chartData = new google.visualization.DataTable();
    chartData.addColumn('string', 'Data');
    chartData.addColumn('number', 'Usuários');
    chartData.addRows(last7);
    const options = {
        backgroundColor: 'transparent', colors: [NEON_BLUE], legend: 'none',
        chartArea: {width: '100%', height: '100%'},
        hAxis: { textPosition: 'none', gridlines: {color: 'transparent'}, baselineColor: 'transparent' },
        vAxis: { textPosition: 'none', gridlines: {color: 'transparent'}, baselineColor: 'transparent' },
        tooltip: { textStyle: { fontName: 'Arial', fontSize: 12 } },
        lineWidth: 3, pointSize: 6, pointShape: 'circle'
    };
    new google.visualization.LineChart(document.getElementById('tendencia_chart')).draw(chartData, options);
}

function drawPie(data) {
    const devices = { Desktop: 0, Mobile: 0 };
    data.forEach(d => { 
        if (d.device && d.device.toLowerCase().includes('mobile')) devices.Mobile += d.users; 
        else devices.Desktop += d.users; 
    });
    const chartData = google.visualization.arrayToDataTable([['Device', 'Users'], ['Desktop', devices.Desktop], ['Mobile', devices.Mobile]]);
    const options = {
        backgroundColor: 'transparent', colors: [NEON_BLUE, '#05445e'],
        pieHole: 0.5, legend: 'none', pieSliceBorderColor: 'transparent',
        chartArea: {width: '100%', height: '100%'},
        tooltip: { textStyle: { fontName: 'Arial', fontSize: 12 } }
    };
    new google.visualization.PieChart(document.getElementById('tech_stack_pie')).draw(chartData, options);
}

function drawMap(data) {
    const countryMap = {};
    data.forEach(d => { const country = d.country || "Brazil"; countryMap[country] = (countryMap[country] || 0) + d.users; });
    const chartData = google.visualization.arrayToDataTable([['Country', 'Users'], ...Object.entries(countryMap)]);
    const options = {
        backgroundColor: 'transparent', datalessRegionColor: '#0d1620',
        colorAxis: {colors: ['#00333d', NEON_BLUE]}, legend: 'none',
        tooltip: { textStyle: { fontName: 'Arial', fontSize: 12 } }
    };
    new google.visualization.GeoChart(document.getElementById('regions_div')).draw(chartData, options);
}
</script>
</body>
</html>
